name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-modern:
    name: build-modern-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact-name: modern-windows-artifacts
            artifact-path: |
              modern-ui/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
              modern-ui/src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
              modern-ui/src-tauri/target/release/CoordenacaoOP_*_windows_portable.zip
          - platform: linux
            os: ubuntu-22.04
            artifact-name: modern-linux-artifacts
            artifact-path: |
              modern-ui/src-tauri/target/release/bundle/appimage/*.AppImage
              modern-ui/src-tauri/target/release/bundle/appimage/*.AppImage.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: modern-ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        working-directory: modern-ui
        run: npm ci

      - name: Validate updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Configure o secret TAURI_SIGNING_PRIVATE_KEY para gerar releases com self-update."
          }

      - name: Build Tauri updater artifacts
        working-directory: modern-ui
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Package Windows portable
        if: matrix.platform == 'windows'
        working-directory: modern-ui
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem src-tauri/target/release/*.exe | Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1
          if (-not $exe) {
            throw "Executavel portatil nao encontrado em src-tauri/target/release."
          }
          Compress-Archive -Path $exe.FullName -DestinationPath "src-tauri/target/release/CoordenacaoOP_${version}_windows_portable.zip" -Force

      - name: Upload modern artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  publish:
    needs: [build-modern]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download modern windows artifact
        uses: actions/download-artifact@v5
        with:
          name: modern-windows-artifacts
          path: artifacts

      - name: Download modern linux artifact
        uses: actions/download-artifact@v5
        with:
          name: modern-linux-artifacts
          path: artifacts

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = (Get-Content modern-ui/package.json | ConvertFrom-Json).version
          $windowsInstaller = Get-ChildItem artifacts -Recurse -File -Filter "*_x64-setup.exe" | Select-Object -First 1
          $windowsSignature = Get-Content -Raw "$($windowsInstaller.FullName).sig"
          $linuxInstaller = Get-ChildItem artifacts -Recurse -File -Filter "*.AppImage" | Select-Object -First 1
          $linuxSignature = Get-Content -Raw "$($linuxInstaller.FullName).sig"

          $latest = [ordered]@{
            version = $version
            notes = "Atualizacao do CoordenacaoOP."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $windowsSignature.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($windowsInstaller.Name)"
              }
              "linux-x86_64" = [ordered]@{
                signature = $linuxSignature.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($linuxInstaller.Name)"
              }
            }
          }

          $latest | ConvertTo-Json -Depth 10 | Out-File -FilePath artifacts/latest.json -Encoding utf8

      - name: Checksums
        run: |
          find artifacts -type f | sort | xargs sha256sum > artifacts/SHA256SUMS.txt

      - name: Prepare release notes
        run: |
          cat > artifacts/RELEASE_NOTES.txt <<'EOF'
          CoordenacaoOP ${{ github.ref_name }} publica melhorias e correcoes da modern-ui.

          Esta release publica os instaladores Tauri para Windows e Linux, o pacote portable Windows, assinaturas do updater e latest.json para autoatualizacao.
          O pacote .flatpak e anexado alguns minutos depois, quando o build dele termina.
          EOF

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/RELEASE_NOTES.txt
          files: |
            artifacts/*.json
            artifacts/*.txt
            artifacts/**/*.AppImage
            artifacts/**/*.sig
            artifacts/**/*.exe
            artifacts/**/*.zip
          generate_release_notes: true

  # Flatpak depois do publish: anexa o .flatpak à release que o publish criou.
  # Se falhar, a release e o auto-update dos outros pacotes já saíram.
  #
  # Com o secret FLATPAK_GPG_PRIVATE_KEY configurado, o build também gera um
  # repositório Flatpak assinado, publicado no GitHub Pages pelo job
  # publish-flatpak-repo. Quem instala por ele (ou pelo .flatpak da release,
  # que aponta para ele) recebe as versões novas pela loja do sistema.
  build-flatpak:
    needs: [publish]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      APP_ID: io.github.thenriques45_dot.CoordenacaoOP
      BUNDLE: CoordenacaoOP_${{ github.ref_name }}_x86_64.flatpak
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      FLATHUB_REPO: https://dl.flathub.org/repo/flathub.flatpakrepo
      HAS_GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY != '' }}
    outputs:
      signed: ${{ env.HAS_GPG_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Import Flatpak signing key
        id: gpg
        if: env.HAS_GPG_KEY == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: flatpak/io.github.thenriques45_dot.CoordenacaoOP.yml
          branch: stable
          build-bundle: false
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Bundle and Flatpak repository
        env:
          GPG_KEY: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -eu
          if [ -z "$GPG_KEY" ]; then
            echo "Sem FLATPAK_GPG_PRIVATE_KEY: gera so o .flatpak avulso, sem atualizacao pela loja."
            flatpak build-bundle --runtime-repo="$FLATHUB_REPO" repo "$BUNDLE" "$APP_ID" stable
            exit 0
          fi

          gpg --export "$GPG_KEY" > coordenacaoop.gpg
          flatpak build-update-repo --gpg-sign="$GPG_KEY" --prune repo
          # O .flatpak da release aponta para o repositório do Pages: quem
          # instalar por ele também passa a receber as atualizações.
          flatpak build-bundle --repo-url="$PAGES_URL/repo" --runtime-repo="$FLATHUB_REPO" \
            --gpg-keys=coordenacaoop.gpg --gpg-sign="$GPG_KEY" repo "$BUNDLE" "$APP_ID" stable

          mkdir site
          mv repo site/repo
          rm -rf site/repo/tmp site/repo/.lock
          chave="$(base64 -w0 coordenacaoop.gpg)"

          cat > site/coordenacaoop.flatpakref <<EOF
          [Flatpak Ref]
          Name=$APP_ID
          Branch=stable
          Title=CoordenacaoOP
          Url=$PAGES_URL/repo/
          SuggestRemoteName=coordenacaoop
          RuntimeRepo=$FLATHUB_REPO
          IsRuntime=false
          GPGKey=$chave
          EOF

          cat > site/coordenacaoop.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=CoordenacaoOP
          Url=$PAGES_URL/repo/
          Homepage=https://github.com/${{ github.repository }}
          GPGKey=$chave
          EOF

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8"><title>CoordenacaoOP para Linux</title></head>
          <body style="font-family:sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem">
          <h1>CoordenacaoOP para Linux (Flatpak)</h1>
          <p><a href="coordenacaoop.flatpakref">Instalar o CoordenacaoOP</a>: abre na loja de aplicativos
          (GNOME Software, Discover). As versões novas chegam pela própria loja.</p>
          <p>Pelo terminal:</p>
          <pre>flatpak install --user $PAGES_URL/coordenacaoop.flatpakref</pre>
          <p>Versão atual: ${{ github.ref_name }}</p>
          </body></html>
          EOF

      - name: Upload Flatpak repository
        if: env.HAS_GPG_KEY == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: flatpak-repo
          path: site
          include-hidden-files: true

      - name: Attach Flatpak to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUNDLE }}

  # Publica o repositório Flatpak na branch gh-pages (GitHub Pages servindo a
  # partir dela). A branch guarda só a versão mais recente, sem histórico.
  publish-flatpak-repo:
    needs: [build-flatpak]
    if: needs.build-flatpak.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Flatpak repository
        uses: actions/download-artifact@v5
        with:
          name: flatpak-repo
          path: site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Repositorio Flatpak ${{ github.ref_name }}"

  # Os jobs da Store ficam fora do `needs` do publish: se o MSIX falhar, a
  # release do GitHub (e o auto-update de quem instalou por lá) sai igual.
  build-store:
    name: build-store-msix
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: modern-ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: modern-ui
        run: npm ci

      - name: Build store variant
        working-directory: modern-ui
        run: npm run tauri build -- --config src-tauri/tauri.store.conf.json --features store

      - name: Pack MSIX
        working-directory: modern-ui
        shell: pwsh
        run: ./scripts/build-msix.ps1

      # Só artifact da execução, nunca anexo da release: o .msix sai sem
      # assinatura (a Store assina na submissão) e não instala fora dela.
      - name: Upload MSIX
        uses: actions/upload-artifact@v6
        with:
          name: coordenacaoop-msix
          path: modern-ui/src-tauri/target/release/msix/*.msix
          if-no-files-found: error

  publish-store:
    needs: [build-store]
    runs-on: windows-latest
    env:
      STORE_PRODUCT_ID: 9NB56ZCKQT6H
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
    steps:
      # Desligado até os quatro secrets existirem (ver docs/microsoft-store.md).
      # Configuração pela metade falha de propósito, em vez de pular calada.
      - name: Check Partner Center credentials
        id: credenciais
        shell: pwsh
        run: |
          $nomes = @('AZURE_AD_TENANT_ID', 'SELLER_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET')
          $faltando = @($nomes | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($faltando.Count -eq $nomes.Count) {
            Write-Host "::notice::Envio automatico a Microsoft Store desligado (secrets do Partner Center nao configurados). Baixe o artifact coordenacaoop-msix e envie pelo Partner Center."
            "habilitado=false" >> $env:GITHUB_OUTPUT
          } elseif ($faltando.Count -gt 0) {
            throw "Secrets do Partner Center incompletos. Faltando: $($faltando -join ', ')"
          } else {
            "habilitado=true" >> $env:GITHUB_OUTPUT
          }

      - name: Download MSIX
        if: steps.credenciais.outputs.habilitado == 'true'
        uses: actions/download-artifact@v5
        with:
          name: coordenacaoop-msix
          path: msix

      - name: Set up Microsoft Store Developer CLI
        if: steps.credenciais.outputs.habilitado == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Partner Center credentials
        if: steps.credenciais.outputs.habilitado == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET

      - name: Submit MSIX to Microsoft Store
        if: steps.credenciais.outputs.habilitado == 'true'
        shell: pwsh
        run: |
          $msix = Get-ChildItem msix -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "Nenhum .msix no artifact coordenacaoop-msix." }
          msstore publish $msix.FullName -id $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore publish falhou ($LASTEXITCODE)" }
